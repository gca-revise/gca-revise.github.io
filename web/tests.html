<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GCA Revise: rule checks</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; }
  .pass { color: #17724B; } .fail { color: #B42A47; font-weight: 700; }
  #summary { font-size: 22px; font-weight: 700; margin-bottom: 16px; }
  li { margin: 4px 0; }
</style>
</head>
<body>
<h1>Rule checks</h1>
<div id="summary">Running...</div>
<ul id="results"></ul>
<script src="js/engine.js"></script>
<script>
const results = [];
function check(name, condition) { results.push({ name, ok: !!condition }); }

// Make a set of words: w1..wN.
function words(n) {
  return Array.from({ length: n }, (_, i) => ({ id: `w${i + 1}`, word: `Word${i + 1}`, definition: `def ${i + 1}` }));
}

// ---- Typed answers ----
check("capitals ignored", Engine.isCorrect("AMBITION", "Ambition"));
check("extra spaces ignored", Engine.isCorrect("  free   will ", "Free will"));
check("accents ignored (facade)", Engine.isCorrect("facade", "Façade"));
check("hyphen or space both fine", Engine.isCorrect("self fulfilling prophecy", "Self-fulfilling prophecy"));
check("hyphen typed, space in word", Engine.isCorrect("cliff-hanger", "Cliff-hanger"));
check("bracket optional", Engine.isCorrect("post traumatic stress disorder", "Post-traumatic stress disorder (PTSD)"));
check("bracket included also fine", Engine.isCorrect("post-traumatic stress disorder (ptsd)", "Post-traumatic stress disorder (PTSD)"));
check("spelling mistake is wrong", !Engine.isCorrect("ambigous", "ambiguous"));
check("blank is wrong", !Engine.isCorrect("   ", "ambiguous"));

// ---- Leniency: lead-in words, word forms, near misses ----
check("lead-in 'the' can be left out", Engine.isCorrect("natural order", "The natural order"));
check("lead-in 'the' can be typed anyway", Engine.isCorrect("the natural order", "The natural order"));
check("ing form accepted (subverting)", Engine.isCorrect("subverting gender expectations", "Subvert gender expectations"));
check("s form accepted (subverts)", Engine.isCorrect("subverts gender expectation", "Subvert gender expectations"));
check("ambiguity accepted for ambiguous", Engine.isCorrect("ambiguity", "Ambiguous"));
check("conjure accepted for conjuration", Engine.isCorrect("conjure", "Conjuration"));
check("tyrants accepted for tyrant", Engine.isCorrect("tyrants", "Tyrant"));
check("short words not mixed up (fat is not fate)", !Engine.isCorrect("fat", "Fate"));
check("part of a phrase is not enough", !Engine.isCorrect("will", "Free will"));
check("a different word is wrong", !Engine.isCorrect("banana", "Ambiguous"));
check("slip of one letter is 'near'", Engine.isNear("ambigous", "Ambiguous") && !Engine.isCorrect("ambigous", "Ambiguous"));
check("swapped letters are 'near'", Engine.isNear("recieve", "Receive"));
check("a different word is not 'near'", !Engine.isNear("banana", "Ambiguous"));
check("a correct answer is not 'near'", !Engine.isNear("ambiguous", "Ambiguous"));
check("nihilist accepted for nihilistic", Engine.isCorrect("nihilist", "Nihilistic"));
check("nihilism accepted for nihilistic", Engine.isCorrect("nihilism", "Nihilistic"));
check("nihilistic accepted for nihilist", Engine.isCorrect("nihilistic", "Nihilist"));
check("patriarchy accepted for patriarchal", Engine.isCorrect("patriarchy", "Patriarchal"));
check("patriarchal accepted for patriarchy", Engine.isCorrect("patriarchal", "Patriarchy"));
check("ambition accepted for ambitious", Engine.isCorrect("ambitious", "Ambition"));
check("power accepted for powerful", Engine.isCorrect("powerful", "Power"));
check("prophecies accepted for prophecy", Engine.isCorrect("prophecies", "Prophecy"));
check("tragic is not tragedy-level loose (tragic vs tragedy still rejected)", !Engine.isCorrect("tragedy", "Tragic hero"));
check("different words stay different (fate / fatal)", !Engine.isCorrect("fatal", "Fate"));
check("different words stay different (free / freedom is fine, will / wilful not)", !Engine.isCorrect("wilful", "Free will"));
check("session reports near", (() => {
  const s = new Session({ items: [{ id: "a", word: "Ambiguous", definition: "d" }], mode: "learn" });
  s.next();
  const r = s.answer("ambigous");
  return r.near && !r.correct && s.points === 0 && !s.retired.has("a");
})());

// ---- Blank out the answer in a definition ----
check("blank: other form of the word", Engine.blankWord("Something you can throw away or dispose of easily.", "Disposable") === "Something you can throw away or _____ of easily.");
check("blank: word inside a phrase", Engine.blankWord("Wanting to achieve great scientific discoveries.", "Scientific ambition") === "Wanting to achieve great _____ discoveries.");
check("blank: two words together share one blank", Engine.blankWord("The story is told in third person (he/she).", "Third-person limited") === "The story is told in _____ (he/she).");
check("blank: demon for Demoniacal", Engine.blankWord("Possessed by a demon.", "Demoniacal") === "Possessed by a _____.");
check("blank: directly for Direct victims of war", Engine.blankWord("Soldiers directly involved in the fighting.", "Direct victims of war") === "Soldiers _____ involved in the fighting.");
check("blank: nothing to blank leaves text alone", Engine.blankWord("A prediction of the future.", "Prophecy") === "A prediction of the future.");

// ---- Bold the key word in a sentence ----
const boldText = (sentence, word) => Engine.markWord(sentence, word).filter((p) => p.bold).map((p) => p.text).join("|");
check("bold: exact word", boldText("Macbeth shows hubris in Act 5.", "Hubris") === "hubris");
check("bold: other form of the word", boldText("Lady Macbeth belittles her husband.", "Belittle") === "belittles");
check("bold: phrase", boldText("Shakespeare breaks the natural order here.", "The natural order") === "natural order");
check("bold: phrase in another form", boldText("She subverts gender expectations.", "Subvert gender expectations") === "subverts gender expectations");
check("bold: hyphenated phrase", boldText("It is a self-fulfilling prophecy.", "Self-fulfilling prophecy") === "self-fulfilling prophecy");
check("bold: accents", boldText("A false facade of grief.", "Façade") === "facade");
check("bold: Inspect does not bold Inspector", boldText("The Inspector inspects their lives.", "Inspect") === "inspects");
check("bold: Set bolds only the word set", boldText("Priestley’s set is heavy.", "Set") === "set");
check("transgresses accepted for transgress", Engine.isCorrect("transgresses", "Transgress"));
check("transgress accepted for transgressed", Engine.isCorrect("transgress", "Transgressed"));
check("bold: transgresses", boldText("Jekyll transgresses the limits.", "Transgress") === "transgresses");
check("bold: nothing found leaves text alone", Engine.markWord("Nothing here.", "Hubris").length === 1 && !Engine.markWord("Nothing here.", "Hubris")[0].bold);
check("bold: pieces join back to the sentence", Engine.markWord("Macbeth shows hubris in Act 5.", "Hubris").map((p) => p.text).join("") === "Macbeth shows hubris in Act 5.");

// ---- Learn the set ----
{
  const s = new Session({ items: words(5), mode: "learn" });
  const seen = [];
  let prev = null, twice = false;
  for (let i = 0; i < 5; i++) {
    const w = s.next();
    seen.push(w.id);
    if (prev === w.id) twice = true;
    prev = w.id;
    s.answer("wrong"); // get it wrong so nothing retires
  }
  check("each word asked once before any repeat", new Set(seen).size === 5);
  check("same word not twice in a row (first pass)", !twice);
}
{
  const s = new Session({ items: words(6), mode: "learn" });
  let twice = false, prev = null;
  for (let i = 0; i < 60; i++) {
    const w = s.next();
    if (prev === w.id) twice = true;
    prev = w.id;
    s.answer("wrong");
  }
  check("same word never twice in a row (60 wrong answers)", !twice);
}
{
  const s = new Session({ items: words(3), mode: "learn" });
  const w = s.next();
  const r = s.answer(w.word);
  check("correct typed answer retires the word", r.correct && r.retiredNow && s.retired.has(w.id));
  check("a point is scored", s.points === 1 && s.right === 1);
  check("learned count goes up", s.learnedCount() === 1);
}
{
  const s = new Session({ items: words(3), mode: "learn" });
  const w = s.next();
  const r = s.answer("nope");
  check("wrong answer does not retire", !r.correct && !s.retired.has(w.id));
  check("wrong answer scores nothing and is counted", s.points === 0 && s.wrong === 1);
  check("missed word is recorded", s.trickiest()[0].word === w.word && s.trickiest()[0].times === 1);
}
{
  // Missed words come back; the set ends only when every word is retired.
  const s = new Session({ items: words(4), mode: "learn" });
  let questions = 0, missedOne = false;
  while (s.next() && questions < 100) {
    questions++;
    if (!missedOne) { s.answer("wrong"); missedOne = true; }
    else s.answer(s.current.word);
  }
  check("set completes after all words are right", s.isComplete() && s.learnedCount() === 4);
  check("a missed word came back (5 questions for 4 words)", questions === 5);
  check("next() returns nothing when complete", s.next() === null);
}
{
  const s = new Session({ items: words(3), mode: "learn", retiredIds: new Set(["w1", "w2", "w3"]) });
  check("already-learned set is complete straight away", s.isComplete() && s.next() === null);
}
{
  const s = new Session({ items: words(3), mode: "learn", retiredIds: new Set(["w1"]) });
  const asked = new Set();
  for (let i = 0; i < 20; i++) { const w = s.next(); if (!w) break; asked.add(w.id); s.answer("wrong"); }
  check("learned words are not asked again", !asked.has("w1") && asked.size === 2);
}

// ---- Multiple choice ----
const pool = [
  ["belittle", "Belittle"], ["exalt", "Exalt"], ["foreshadow", "Foreshadow"], ["hamartia", "Hamartia"],
  ["nihilism", "Nihilism"], ["nihilistic", "Nihilistic"], ["free-will", "Free will"], ["fate", "Fate"], ["thane", "Thane"],
].map(([id, word]) => ({ id, word, definition: "def " + id }));
{
  const target = pool.find((w) => w.id === "belittle");
  const opts = Engine.makeChoices(target, pool, []);
  check("four options", opts.length === 4);
  check("the right word is one of the options", opts.some((o) => o.id === "belittle"));
  check("no option appears twice", new Set(opts.map((o) => o.id)).size === 4);
  let clash = false;
  const nih = pool.find((w) => w.id === "nihilistic");
  for (let i = 0; i < 50; i++) if (Engine.makeChoices(nih, pool, []).some((o) => o.id === "nihilism")) clash = true;
  check("a cognate (nihilism) is never a wrong option for nihilistic", !clash);
  const small = pool.slice(0, 2);
  const padded = Engine.makeChoices(small[0], small, pool);
  check("a small set borrows options from the extra pool", padded.length === 4);
  const phrase = pool.find((w) => w.id === "free-will");
  check("a phrase answer still gets four options", Engine.makeChoices(phrase, pool, []).length === 4);
}
{
  const s = new Session({ items: words(5), mode: "learn", kind: "choose" });
  const w = s.next();
  check("options are made for each question", s.options.length === 4 && s.options.some((o) => o.id === w.id));
  const wrongId = s.options.find((o) => o.id !== w.id).id;
  const r1 = s.answerChoice(wrongId);
  check("wrong choice: no point, no retire, no count", !r1.correct && s.points === 0 && !s.retired.has(w.id) && !s.choiceCounts[w.id]);
  s.next();
  const second = s.current;
  const r2 = s.answerChoice(second.id);
  check("first right choice: point, counted, not yet learned", r2.correct && s.points === 1 && s.choiceCounts[second.id] === 1 && !s.retired.has(second.id) && !r2.retiredNow);
  check("choice result reports progress", r2.rightSoFar === 1 && r2.needed === 2);
}
{
  const s = new Session({ items: words(2), mode: "learn", kind: "choose", choiceCounts: { w1: 1 } });
  let found = null;
  for (let i = 0; i < 6 && !found; i++) { const w = s.next(); if (w.id === "w1") found = w; else s.answerChoice("nope"); }
  const r = s.answerChoice("w1");
  check("second right choice retires the word", r.correct && r.retiredNow && s.retired.has("w1"));
}
{
  const s = new Session({ items: words(2), mode: "learn", kind: "choose", choiceCounts: { w1: 1 } });
  let w = s.next();
  while (w.id !== "w1") { s.answerChoice("nope"); w = s.next(); }
  s.answerChoice("nope");
  check("a wrong choice does not remove an earlier right one", s.choiceCounts.w1 === 1 && !s.retired.has("w1"));
}
{
  const s = new Session({ items: words(3), mode: "free", kind: "choose" });
  let counted = false;
  for (let i = 0; i < 10; i++) { const w = s.next(); s.answerChoice(w.id); }
  check("free practice: choices score points but never retire or count", s.points === 10 && s.retired.size === 0 && Object.keys(s.choiceCounts).length === 0);
}
{
  const s = new Session({ items: words(3), mode: "learn", kind: "choose" });
  let guard = 0;
  while (s.next() && guard++ < 50) { s.answerChoice(s.current.id); }
  const w = s.items[0];
  check("each word needs two right choices (set ends only after two passes)", s.isComplete() && guard === 6);
}
{
  const s = new Session({ items: words(3), mode: "learn", kind: "type" });
  const w = s.next();
  s.answer(w.word);
  check("typed answers still retire after one", s.retired.has(w.id) && s.options === null);
}

// ---- Streak and best streak ----
{
  const s = new Session({ items: words(5), mode: "learn" });
  const answerRight = () => { s.next(); s.answer(s.current.word); };
  const answerWrong = () => { s.next(); s.answer("zzz"); };
  answerRight(); answerRight(); answerRight(); answerWrong(); answerRight();
  check("streak resets on a wrong answer", s.streak === 1);
  check("best streak remembered", s.bestStreak === 3);
}

// ---- Free practice ----
{
  const s = new Session({ items: words(3), mode: "free" });
  let ended = false;
  for (let i = 0; i < 30; i++) {
    const w = s.next();
    if (!w) { ended = true; break; }
    s.answer(w.word);
  }
  check("free practice never ends", !ended && !s.isComplete());
  check("free practice retires nothing", s.retired.size === 0);
  check("free practice still scores points", s.points === 30);
}

// ---- One word only ----
{
  const s = new Session({ items: words(1), mode: "free" });
  check("a one-word set still works", s.next().id === "w1" && s.next().id === "w1");
}

// ---- Show results ----
const failed = results.filter((r) => !r.ok).length;
document.getElementById("summary").textContent =
  failed === 0 ? `All ${results.length} checks passed` : `${failed} of ${results.length} checks FAILED`;
document.getElementById("summary").className = failed === 0 ? "pass" : "fail";
document.getElementById("results").innerHTML = results
  .map((r) => `<li class="${r.ok ? "pass" : "fail"}">${r.ok ? "PASS" : "FAIL"}: ${r.name}</li>`)
  .join("");
</script>
</body>
</html>
