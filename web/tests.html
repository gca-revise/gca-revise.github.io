<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GCA Revise: rule checks</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; }
  .pass { color: #17724B; } .fail { color: #B42A47; font-weight: 700; }
  #summary { font-size: 22px; font-weight: 700; margin-bottom: 16px; }
  li { margin: 4px 0; }
</style>
</head>
<body>
<h1>Rule checks</h1>
<div id="summary">Running...</div>
<ul id="results"></ul>
<script src="js/engine.js"></script>
<script>
const results = [];
function check(name, condition) { results.push({ name, ok: !!condition }); }

// Make a set of words: w1..wN.
function words(n) {
  return Array.from({ length: n }, (_, i) => ({ id: `w${i + 1}`, word: `Word${i + 1}`, definition: `def ${i + 1}` }));
}

// ---- Typed answers ----
check("capitals ignored", Engine.isCorrect("AMBITION", "Ambition"));
check("extra spaces ignored", Engine.isCorrect("  free   will ", "Free will"));
check("accents ignored (facade)", Engine.isCorrect("facade", "Façade"));
check("hyphen or space both fine", Engine.isCorrect("self fulfilling prophecy", "Self-fulfilling prophecy"));
check("hyphen typed, space in word", Engine.isCorrect("cliff-hanger", "Cliff-hanger"));
check("bracket optional", Engine.isCorrect("post traumatic stress disorder", "Post-traumatic stress disorder (PTSD)"));
check("bracket included also fine", Engine.isCorrect("post-traumatic stress disorder (ptsd)", "Post-traumatic stress disorder (PTSD)"));
check("spelling mistake is wrong", !Engine.isCorrect("ambigous", "ambiguous"));
check("blank is wrong", !Engine.isCorrect("   ", "ambiguous"));

// ---- Leniency: lead-in words, word forms, near misses ----
check("lead-in 'the' can be left out", Engine.isCorrect("natural order", "The natural order"));
check("lead-in 'the' can be typed anyway", Engine.isCorrect("the natural order", "The natural order"));
check("ing form accepted (subverting)", Engine.isCorrect("subverting gender expectations", "Subvert gender expectations"));
check("s form accepted (subverts)", Engine.isCorrect("subverts gender expectation", "Subvert gender expectations"));
check("ambiguity accepted for ambiguous", Engine.isCorrect("ambiguity", "Ambiguous"));
check("conjure accepted for conjuration", Engine.isCorrect("conjure", "Conjuration"));
check("tyrants accepted for tyrant", Engine.isCorrect("tyrants", "Tyrant"));
check("short words not mixed up (fat is not fate)", !Engine.isCorrect("fat", "Fate"));
check("part of a phrase is not enough", !Engine.isCorrect("will", "Free will"));
check("a different word is wrong", !Engine.isCorrect("banana", "Ambiguous"));
check("slip of one letter is 'near'", Engine.isNear("ambigous", "Ambiguous") && !Engine.isCorrect("ambigous", "Ambiguous"));
check("swapped letters are 'near'", Engine.isNear("recieve", "Receive"));
check("a different word is not 'near'", !Engine.isNear("banana", "Ambiguous"));
check("a correct answer is not 'near'", !Engine.isNear("ambiguous", "Ambiguous"));
check("nihilist accepted for nihilistic", Engine.isCorrect("nihilist", "Nihilistic"));
check("nihilism accepted for nihilistic", Engine.isCorrect("nihilism", "Nihilistic"));
check("nihilistic accepted for nihilist", Engine.isCorrect("nihilistic", "Nihilist"));
check("patriarchy accepted for patriarchal", Engine.isCorrect("patriarchy", "Patriarchal"));
check("patriarchal accepted for patriarchy", Engine.isCorrect("patriarchal", "Patriarchy"));
check("ambition accepted for ambitious", Engine.isCorrect("ambitious", "Ambition"));
check("power accepted for powerful", Engine.isCorrect("powerful", "Power"));
check("prophecies accepted for prophecy", Engine.isCorrect("prophecies", "Prophecy"));
check("tragic is not tragedy-level loose (tragic vs tragedy still rejected)", !Engine.isCorrect("tragedy", "Tragic hero"));
check("different words stay different (fate / fatal)", !Engine.isCorrect("fatal", "Fate"));
check("different words stay different (free / freedom is fine, will / wilful not)", !Engine.isCorrect("wilful", "Free will"));
check("session reports near", (() => {
  const s = new Session({ items: [{ id: "a", word: "Ambiguous", definition: "d" }], mode: "learn" });
  s.next();
  const r = s.answer("ambigous");
  return r.near && !r.correct && s.points === 0 && !s.retired.has("a");
})());

// ---- Blank out the answer in a definition ----
check("blank: other form of the word", Engine.blankWord("Something you can throw away or dispose of easily.", "Disposable") === "Something you can throw away or _____ of easily.");
check("blank: word inside a phrase", Engine.blankWord("Wanting to achieve great scientific discoveries.", "Scientific ambition") === "Wanting to achieve great _____ discoveries.");
check("blank: two words together share one blank", Engine.blankWord("The story is told in third person (he/she).", "Third-person limited") === "The story is told in _____ (he/she).");
check("blank: demon for Demoniacal", Engine.blankWord("Possessed by a demon.", "Demoniacal") === "Possessed by a _____.");
check("blank: directly for Direct victims of war", Engine.blankWord("Soldiers directly involved in the fighting.", "Direct victims of war") === "Soldiers _____ involved in the fighting.");
check("blank: nothing to blank leaves text alone", Engine.blankWord("A prediction of the future.", "Prophecy") === "A prediction of the future.");

// ---- Bold the key word in a sentence ----
const boldText = (sentence, word) => Engine.markWord(sentence, word).filter((p) => p.bold).map((p) => p.text).join("|");
check("bold: exact word", boldText("Macbeth shows hubris in Act 5.", "Hubris") === "hubris");
check("bold: other form of the word", boldText("Lady Macbeth belittles her husband.", "Belittle") === "belittles");
check("bold: phrase", boldText("Shakespeare breaks the natural order here.", "The natural order") === "natural order");
check("bold: phrase in another form", boldText("She subverts gender expectations.", "Subvert gender expectations") === "subverts gender expectations");
check("bold: hyphenated phrase", boldText("It is a self-fulfilling prophecy.", "Self-fulfilling prophecy") === "self-fulfilling prophecy");
check("bold: accents", boldText("A false facade of grief.", "Façade") === "facade");
check("bold: Inspect does not bold Inspector", boldText("The Inspector inspects their lives.", "Inspect") === "inspects");
check("bold: Set bolds only the word set", boldText("Priestley’s set is heavy.", "Set") === "set");
check("transgresses accepted for transgress", Engine.isCorrect("transgresses", "Transgress"));
check("transgress accepted for transgressed", Engine.isCorrect("transgress", "Transgressed"));
check("bold: transgresses", boldText("Jekyll transgresses the limits.", "Transgress") === "transgresses");
check("bold: nothing found leaves text alone", Engine.markWord("Nothing here.", "Hubris").length === 1 && !Engine.markWord("Nothing here.", "Hubris")[0].bold);
check("bold: pieces join back to the sentence", Engine.markWord("Macbeth shows hubris in Act 5.", "Hubris").map((p) => p.text).join("") === "Macbeth shows hubris in Act 5.");

// ---- Learn the set ----
{
  const s = new Session({ items: words(5), mode: "learn" });
  const seen = [];
  let prev = null, twice = false;
  for (let i = 0; i < 5; i++) {
    const w = s.next();
    seen.push(w.id);
    if (prev === w.id) twice = true;
    prev = w.id;
    s.answer("wrong"); // get it wrong so nothing retires
  }
  check("each word asked once before any repeat", new Set(seen).size === 5);
  check("same word not twice in a row (first pass)", !twice);
}
{
  const s = new Session({ items: words(6), mode: "learn" });
  let twice = false, prev = null;
  for (let i = 0; i < 60; i++) {
    const w = s.next();
    if (prev === w.id) twice = true;
    prev = w.id;
    s.answer("wrong");
  }
  check("same word never twice in a row (60 wrong answers)", !twice);
}
{
  const s = new Session({ items: words(3), mode: "learn" });
  const w = s.next();
  const r = s.answer(w.word);
  check("correct typed answer retires the word", r.correct && r.retiredNow && s.retired.has(w.id));
  check("a point is scored", s.points === 1 && s.right === 1);
  check("learned count goes up", s.learnedCount() === 1);
}
{
  const s = new Session({ items: words(3), mode: "learn" });
  const w = s.next();
  const r = s.answer("nope");
  check("wrong answer does not retire", !r.correct && !s.retired.has(w.id));
  check("wrong answer scores nothing and is counted", s.points === 0 && s.wrong === 1);
  check("missed word is recorded", s.trickiest()[0].word === w.word && s.trickiest()[0].times === 1);
}
{
  // Missed words come back; the set ends only when every word is retired.
  const s = new Session({ items: words(4), mode: "learn" });
  let questions = 0, missedOne = false;
  while (s.next() && questions < 100) {
    questions++;
    if (!missedOne) { s.answer("wrong"); missedOne = true; }
    else s.answer(s.current.word);
  }
  check("set completes after all words are right", s.isComplete() && s.learnedCount() === 4);
  check("a missed word came back (5 questions for 4 words)", questions === 5);
  check("next() returns nothing when complete", s.next() === null);
}
{
  const s = new Session({ items: words(3), mode: "learn", retiredIds: new Set(["w1", "w2", "w3"]) });
  check("already-learned set is complete straight away", s.isComplete() && s.next() === null);
}
{
  const s = new Session({ items: words(3), mode: "learn", retiredIds: new Set(["w1"]) });
  const asked = new Set();
  for (let i = 0; i < 20; i++) { const w = s.next(); if (!w) break; asked.add(w.id); s.answer("wrong"); }
  check("learned words are not asked again", !asked.has("w1") && asked.size === 2);
}

// ---- Multiple choice ----
const pool = [
  ["belittle", "Belittle"], ["exalt", "Exalt"], ["foreshadow", "Foreshadow"], ["hamartia", "Hamartia"],
  ["nihilism", "Nihilism"], ["nihilistic", "Nihilistic"], ["free-will", "Free will"], ["fate", "Fate"], ["thane", "Thane"],
].map(([id, word]) => ({ id, word, definition: "def " + id }));
{
  const target = pool.find((w) => w.id === "belittle");
  const opts = Engine.makeChoices(target, pool, []);
  check("four options", opts.length === 4);
  check("the right word is one of the options", opts.some((o) => o.id === "belittle"));
  check("no option appears twice", new Set(opts.map((o) => o.id)).size === 4);
  let clash = false;
  const nih = pool.find((w) => w.id === "nihilistic");
  for (let i = 0; i < 50; i++) if (Engine.makeChoices(nih, pool, []).some((o) => o.id === "nihilism")) clash = true;
  check("a cognate (nihilism) is never a wrong option for nihilistic", !clash);
  const small = pool.slice(0, 2);
  const padded = Engine.makeChoices(small[0], small, pool);
  check("a small set borrows options from the extra pool", padded.length === 4);
  const phrase = pool.find((w) => w.id === "free-will");
  check("a phrase answer still gets four options", Engine.makeChoices(phrase, pool, []).length === 4);
}
{
  const s = new Session({ items: words(5), mode: "learn", kind: "choose" });
  const w = s.next();
  check("options are made for each question", s.options.length === 4 && s.options.some((o) => o.id === w.id));
  const wrongId = s.options.find((o) => o.id !== w.id).id;
  const r1 = s.answerChoice(wrongId);
  check("wrong choice: no point, no retire, no count", !r1.correct && s.points === 0 && !s.retired.has(w.id) && !s.choiceCounts[w.id]);
  s.next();
  const second = s.current;
  const r2 = s.answerChoice(second.id);
  check("first right choice: point, counted, not yet learned", r2.correct && s.points === 1 && s.choiceCounts[second.id] === 1 && !s.retired.has(second.id) && !r2.retiredNow);
  check("choice result reports progress", r2.rightSoFar === 1 && r2.needed === 2);
}
{
  const s = new Session({ items: words(2), mode: "learn", kind: "choose", choiceCounts: { w1: 1 } });
  let found = null;
  for (let i = 0; i < 6 && !found; i++) { const w = s.next(); if (w.id === "w1") found = w; else s.answerChoice("nope"); }
  const r = s.answerChoice("w1");
  check("second right choice retires the word", r.correct && r.retiredNow && s.retired.has("w1"));
}
{
  const s = new Session({ items: words(2), mode: "learn", kind: "choose", choiceCounts: { w1: 1 } });
  let w = s.next();
  while (w.id !== "w1") { s.answerChoice("nope"); w = s.next(); }
  s.answerChoice("nope");
  check("a wrong choice does not remove an earlier right one", s.choiceCounts.w1 === 1 && !s.retired.has("w1"));
}
{
  const s = new Session({ items: words(3), mode: "free", kind: "choose" });
  let counted = false;
  for (let i = 0; i < 10; i++) { const w = s.next(); s.answerChoice(w.id); }
  check("free practice: choices score points but never retire or count", s.points === 10 && s.retired.size === 0 && Object.keys(s.choiceCounts).length === 0);
}
{
  const s = new Session({ items: words(3), mode: "learn", kind: "choose" });
  let guard = 0;
  while (s.next() && guard++ < 50) { s.answerChoice(s.current.id); }
  const w = s.items[0];
  check("each word needs two right choices (set ends only after two passes)", s.isComplete() && guard === 6);
}
{
  const s = new Session({ items: words(3), mode: "learn", kind: "type" });
  const w = s.next();
  s.answer(w.word);
  check("typed answers still retire after one", s.retired.has(w.id) && s.options === null);
}

// ---- Matching ----
{
  const g = new MatchGame({ items: words(10), mode: "learn" });
  g.newRound();
  check("a round has four different words", g.words.length === 4 && new Set(g.words.map((w) => w.id)).size === 4);
  check("both columns show the same four words", g.left.length === 4 && g.right.length === 4 && g.left.every((w) => g.right.includes(w)));
  const ids = g.words.map((w) => w.id);
  check("tapping a word selects it", g.select("w", ids[0]) === "selected" && g.pending.id === ids[0]);
  check("tapping it again unselects it", g.select("w", ids[0]) === "unselected" && g.pending === null);
  g.select("w", ids[0]);
  check("tapping another word moves the selection", g.select("w", ids[1]) === "selected" && g.pending.id === ids[1]);
  check("a wrong pair is a slip", g.select("m", ids[2]) === "slip" && g.slips === 1 && g.slip.wordId === ids[1] && g.slip.meaningId === ids[2] && g.pending === null);
  check("the next tap clears the slip marker", g.select("m", ids[0]) === "selected" && g.slip === null);
  check("meaning first then word works", g.select("w", ids[0]) === "match" && g.matched.has(ids[0]));
  check("a matched pair cannot be tapped again", g.select("w", ids[0]) === "ignored");
  g.select("w", ids[1]); g.select("m", ids[1]);
  g.select("w", ids[2]); g.select("m", ids[2]);
  g.select("w", ids[3]);
  const last = g.select("m", ids[3]);
  check("finishing the round ends it", last === "match" && g.roundDone && g.rounds === 1);
  check("a round with a slip scores nothing and ends the streak", g.points === 0 && g.streak === 0 && g.perfectRounds === 0);
  check("nothing is retired by matching", g.retired.size === 0);
}
{
  const g = new MatchGame({ items: words(10), mode: "learn" });
  const play = (slip) => {
    g.newRound();
    const ids = g.words.map((w) => w.id);
    if (slip) { g.select("w", ids[0]); g.select("m", ids[1]); }
    for (const id of ids) { g.select("w", id); g.select("m", id); }
  };
  play(false); play(false);
  check("a perfect round scores one point and builds the streak", g.points === 2 && g.streak === 2 && g.perfectRounds === 2);
  play(true);
  check("a slip round scores nothing and resets the streak", g.points === 2 && g.streak === 0 && g.bestStreak === 2);
  play(false);
  check("a perfect round after a slip starts the streak again", g.points === 3 && g.streak === 1);
}
{
  const g = new MatchGame({ items: words(8), mode: "learn" });
  const seen = new Set();
  for (let i = 0; i < 2; i++) { g.newRound(); g.words.forEach((w) => seen.add(w.id)); }
  check("two rounds cover all eight words before any repeat", seen.size === 8);
}
{
  const g = new MatchGame({ items: words(10), mode: "learn", retiredIds: new Set(["w1", "w2", "w3", "w4", "w5", "w6"]) });
  g.newRound();
  const inRound = g.words.map((w) => w.id);
  check("learned words are skipped while enough unlearned words remain", g.words.length === 4 && inRound.every((id) => !["w1", "w2", "w3", "w4", "w5", "w6"].includes(id)));
}
{
  const g = new MatchGame({ items: words(10), mode: "learn", retiredIds: new Set(["w1", "w2", "w3", "w4", "w5", "w6", "w7", "w8"]) });
  g.newRound();
  check("with fewer than four unlearned words, rounds use the whole set", g.words.length === 4);
}
{
  const g = new MatchGame({ items: words(3), mode: "free" });
  g.newRound();
  check("a small set gets a smaller round", g.words.length === 3);
}
{
  const similar = [
    { id: "nihilism", word: "Nihilism", definition: "d1" }, { id: "nihilistic", word: "Nihilistic", definition: "d2" },
    { id: "a", word: "Aaa", definition: "d3" }, { id: "b", word: "Bbb", definition: "d4" }, { id: "c", word: "Ccc", definition: "d5" },
  ];
  let together = false;
  for (let i = 0; i < 40; i++) {
    const g = new MatchGame({ items: similar, mode: "free" });
    g.newRound();
    const ids = g.words.map((w) => w.id);
    if (ids.includes("nihilism") && ids.includes("nihilistic")) together = true;
  }
  check("nihilism and nihilistic are never in the same round", !together);
}

// ---- Quotes (Know it level) ----
{
  const quotes = [
    { id: "q1", text: "macbeth", speaker: "Witches", quote: "Fair is foul and foul is fair", gap_word: "foul", note: "n1" },
    { id: "q2", text: "macbeth", speaker: "Macbeth", quote: "Is this a dagger which I see before me", gap_word: "dagger", note: "" },
    { id: "q3", text: "macbeth", speaker: "Lady Macbeth", quote: "Out, damned spot! Out, I say!", gap_word: "damned", note: "" },
    { id: "q4", text: "macbeth", speaker: "Macduff", quote: "He has no children", gap_word: "children", note: "" },
    { id: "q5", text: "macbeth", speaker: "Banquo", quote: "Give me the daggers", gap_word: "daggers", note: "" },
    { id: "q6", text: "macbeth", speaker: "Malcolm", quote: "Short one", gap_word: "", note: "" },
    { id: "p1", text: "power-conflict", speaker: "", poem: "Ozymandias", quote: "Look on my Works, ye Mighty, and despair!", gap_word: "despair", note: "" },
    { id: "p2", text: "power-conflict", speaker: "", poem: "London", quote: "Marks of weakness, marks of woe", gap_word: "woe", note: "" },
    { id: "p3", text: "power-conflict", speaker: "", poem: "Remains", quote: "End of story, except not really", gap_word: "story", note: "" },
    { id: "p4", text: "power-conflict", speaker: "", poem: "Exposure", quote: "All their eyes are ice", gap_word: "ice", note: "" },
    { id: "p5", text: "power-conflict", speaker: "", poem: "Kamikaze", quote: "Head full of powerful incantations", gap_word: "incantations", note: "" },
  ];
  check("gap word is found ignoring capitals", QuoteTools.findGap("Out, DAMNED spot", "damned") !== null);
  check("a missing gap word is not found", QuoteTools.findGap("Out, damned spot", "candle") === null);
  const pieces = QuoteTools.gapPieces("Fair is foul and foul is fair", "foul");
  check("every copy of the gap word becomes a gap", pieces.filter((p) => p.gap).length === 2 && pieces.map((p) => p.text).join("") === "Fair is foul and foul is fair");
  check("gap options are lower case at the start of a quote", QuoteTools.gapLabel("Unseamed him from nave to chaps", "Unseamed") === "unseamed");
  check("names in the middle of a quote keep their capital", QuoteTools.gapLabel("Into the mouth of Hell", "Hell") === "Hell");
  check("gap game uses only quotes with a gap word", QuoteTools.items(quotes, "macbeth", "gap").length === 5);
  check("who game skips quotes with no speaker and uses poems for Power and Conflict",
    QuoteTools.items(quotes, "macbeth", "who").length === 6 && QuoteTools.items(quotes, "power-conflict", "who").map((i) => i.word).join() === "Ozymandias,London,Remains,Exposure,Kamikaze");
  check("learned counts cover every askable quote once", QuoteTools.allItems(quotes, "macbeth").length === 6);
  const gap = QuoteTools.items(quotes, "macbeth", "gap");
  const pool = QuoteTools.optionPool(quotes, "macbeth", "gap");
  const make = QuoteTools.optionsFor(pool);
  let ok = true, cognate = false;
  for (let i = 0; i < 40; i++) {
    const d = gap.find((g) => g.id === "q2");
    const opts = make(d);
    if (opts.length !== 4 || !opts.some((o) => o.id === d.answerId) || new Set(opts.map((o) => o.id)).size !== 4) ok = false;
    if (opts.some((o) => o.word === "daggers")) cognate = true;
  }
  check("gap questions get four different options including the right one", ok);
  check("daggers is never a wrong option for dagger", !cognate);
  const who = QuoteTools.items(quotes, "macbeth", "who");
  const whoPool = QuoteTools.optionPool(quotes, "macbeth", "who", ["Banquo", "Duncan", "Ross"]);
  const whoOpts = QuoteTools.optionsFor(whoPool)(who[0]);
  check("who questions get four options including the right speaker", whoOpts.length === 4 && whoOpts.some((o) => o.word === "Witches"));
  const s = new Session({ items: gap, mode: "learn", kind: "choose", optionsFor: make });
  const q = s.next();
  const r = s.answerChoice(q.answerId);
  check("a quote is answered right by choosing its answer option", r.correct && s.choiceCounts[q.id] === 1 && !r.retiredNow);
  const wrongOpt = s.options.find((o) => o.id !== q.answerId);
  const q2 = s.next();
  const r2 = s.answerChoice(s.options.find((o) => o.id !== q2.answerId).id);
  check("the wrong option is wrong", !r2.correct && s.missed[q2.id] === 1);
  check("two right answers learn a quote (any mix of games)", (() => {
    const t = new Session({ items: gap, mode: "learn", kind: "choose", choiceCounts: { q1: 1 }, optionsFor: make });
    let guard = 0, w = t.next();
    while (w && w.id !== "q1" && guard++ < 20) { t.answerChoice("zzz"); w = t.next(); }
    const res = t.answerChoice("gap:foul");
    return res.correct && res.retiredNow && t.retired.has("q1");
  })());
}

// ---- Master it (core quotes) ----
{
  const techniques = [
    { name: "Metaphor", category: "Literary techniques" }, { name: "Simile", category: "Literary techniques" },
    { name: "Hyperbole", category: "Advanced literary techniques" }, { name: "Alliteration", category: "Sound techniques" },
    { name: "Sibilance", category: "Sound techniques" }, { name: "Volta", category: "Poetic techniques" },
    { name: "Caesura", category: "Poetic techniques" }, { name: "Verb", category: "Word types" },
  ];
  const quotes = [
    { id: "a1", text: "macbeth", master: true, speaker: "Macbeth", quote: "O full of scorpions is my mind dear wife", gap_word: "scorpions", note: "n", technique_matches: ["Metaphor", "Hyperbole", "Verb"], technique_notes: ["Metaphor – scorpions suggest poison."] },
    { id: "a2", text: "macbeth", master: true, speaker: "Witches", quote: "Fair is foul and foul is fair", gap_word: "foul", note: "", technique_matches: ["Alliteration"], technique_notes: [] },
    { id: "a3", text: "macbeth", master: false, speaker: "Macbeth", quote: "What's done is done", gap_word: "done", note: "", technique_matches: ["Metaphor"] },
    { id: "a4", text: "macbeth", master: true, speaker: "Macbeth", quote: "Out out brief candle", gap_word: "", note: "", technique_matches: ["Verb"] },
  ];
  check("splitQuote shows the first half", QuoteTools.splitQuote("one two three four five six").prompt === "one two three" && QuoteTools.splitQuote("one two three four five six").rest === "four five six");
  check("splitQuote rounds the prompt up", QuoteTools.splitQuote("one two three four five six seven").prompt === "one two three four");
  check("an exact ending is right", QuoteTools.checkEnding("Is my mind dear wife", "is my mind dear wife") === "right");
  check("capitals and punctuation do not matter", QuoteTools.checkEnding("IS MY MIND, DEAR WIFE!", "is my mind dear wife") === "right");
  check("one small spelling slip is still right", QuoteTools.checkEnding("is my mynd dear wife", "is my mind dear wife") === "right" || QuoteTools.checkEnding("is my mynd dear wife", "is my mind dear wife") === "near");
  check("one word off in a short ending is 'near'", QuoteTools.checkEnding("is my mind dear husband", "is my mind dear wife") === "near");
  check("two words off in a short ending is wrong", QuoteTools.checkEnding("is my head dear husband", "is my mind dear wife") === "wrong");
  check("a different ending is wrong", QuoteTools.checkEnding("something else entirely", "is my mind dear wife") === "wrong");
  check("blank is wrong", QuoteTools.checkEnding("   ", "is my mind dear wife") === "wrong");
  check("a long ending allows a word or two out", QuoteTools.checkEnding("i have almost forgot the taste of fear", "i have almost forgot the taste of fears and") !== "wrong");

  const gapItems = QuoteTools.masterItems(quotes, "macbeth", "mgap", techniques);
  check("Type the gap uses core quotes with a gap word only", gapItems.length === 2 && gapItems.every((i) => i.id.startsWith("mg:")));
  const fin = QuoteTools.masterItems(quotes, "macbeth", "mfinish", techniques);
  check("Finish the quote needs six or more words", fin.length === 1 && fin[0].id === "mf:a1");
  const f = fin[0];
  const sf = new Session({ items: fin, mode: "learn", kind: "type" });
  sf.next();
  const rf = sf.answer(f.rest);
  check("typing the ending right learns the quote (one correct typed answer)", rf.correct && rf.retiredNow && sf.retired.has("mf:a1"));
  const sf2 = new Session({ items: fin, mode: "learn", kind: "type" });
  sf2.next();
  const rf2 = sf2.answer("is my mind dear husband");
  check("a fair attempt at the ending is 'near' and scores nothing", !rf2.correct && rf2.near && sf2.points === 0);
  const sg = new Session({ items: gapItems, mode: "learn", kind: "type" });
  sg.next();
  check("Type the gap checks the gap word", sg.answer(sg.current.word).correct);

  const techItems = QuoteTools.masterItems(quotes, "macbeth", "mtech", techniques);
  check("Spot the technique uses core quotes with a matching technique", techItems.length === 3);
  check("word types are only used if nothing else is labelled", QuoteTools.techniqueChoices(quotes[0], techniques).join() === "Metaphor,Hyperbole" && QuoteTools.techniqueChoices(quotes[3], techniques).join() === "Verb");
  const optionsFor = QuoteTools.techOptionsFor(techniques);
  let good = true, labelledShown = false;
  for (let i = 0; i < 60; i++) {
    const item = techItems.find((t) => t.id === "mt:a1");
    const opts = optionsFor(item);
    if (opts.length !== 4 || new Set(opts.map((o) => o.id)).size !== 4 || !opts.some((o) => o.id === item.answerId)) good = false;
    if (opts.some((o) => o.word !== item.word && ["Metaphor", "Hyperbole", "Verb"].includes(o.word))) labelledShown = true;
  }
  check("Spot the technique gives four different options with the right one", good);
  check("a technique the quote is labelled with is never a wrong option", !labelledShown);
  const st = new Session({ items: techItems, mode: "learn", kind: "choose", optionsFor });
  const first = st.next();
  const rt = st.answerChoice(first.answerId);
  check("choosing the technique scores and counts toward two right answers", rt.correct && st.choiceCounts[first.id] === 1 && !rt.retiredNow);
}

// ---- Streak and best streak ----
{
  const s = new Session({ items: words(5), mode: "learn" });
  const answerRight = () => { s.next(); s.answer(s.current.word); };
  const answerWrong = () => { s.next(); s.answer("zzz"); };
  answerRight(); answerRight(); answerRight(); answerWrong(); answerRight();
  check("streak resets on a wrong answer", s.streak === 1);
  check("best streak remembered", s.bestStreak === 3);
}

// ---- Free practice ----
{
  const s = new Session({ items: words(3), mode: "free" });
  let ended = false;
  for (let i = 0; i < 30; i++) {
    const w = s.next();
    if (!w) { ended = true; break; }
    s.answer(w.word);
  }
  check("free practice never ends", !ended && !s.isComplete());
  check("free practice retires nothing", s.retired.size === 0);
  check("free practice still scores points", s.points === 30);
}

// ---- One word only ----
{
  const s = new Session({ items: words(1), mode: "free" });
  check("a one-word set still works", s.next().id === "w1" && s.next().id === "w1");
}

// ---- Show results ----
const failed = results.filter((r) => !r.ok).length;
document.getElementById("summary").textContent =
  failed === 0 ? `All ${results.length} checks passed` : `${failed} of ${results.length} checks FAILED`;
document.getElementById("summary").className = failed === 0 ? "pass" : "fail";
document.getElementById("results").innerHTML = results
  .map((r) => `<li class="${r.ok ? "pass" : "fail"}">${r.ok ? "PASS" : "FAIL"}: ${r.name}</li>`)
  .join("");
</script>
</body>
